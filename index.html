   <!DOCTYPE html>
<html lang="hi">
<head>

  <style>
       body {

<body>

    function checkPassword() {
      const pwd = document.getElementById('password').value.trim().toLowerCase();
      if (pwd === "priyanshi") {
        alert("Am really sorry , agar tum soch rahi ho ki tumne mereko hurt kiya hai to nhi ye galat h , mere ko bas kuch feelings aa gayi thi , and ab tum Baat bhi na karo to i will feel the same 🙂");
